<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ytt schema documentation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Just a schema documentation example">
    <link href="main.css" rel="stylesheet" />
    <script>
        // Apply a saved theme before first paint to avoid a flash.
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (err) {
            console.warn(err);
        }
    </script>
</head>
<body class="min-h-screen bg-page text-body antialiased">
    <header class="sticky top-0 z-20 border-b border-line bg-page/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
            <div class="min-w-0">
                <h1 class="truncate text-lg font-bold tracking-tight text-heading sm:text-xl">ytt schema documentation</h1>
                <p class="truncate text-sm text-muted">Just a schema documentation example</p>
            </div>
            <div class="flex shrink-0 items-center gap-2 sm:gap-3">
                <span class="inline-flex items-center rounded-full border border-line bg-card px-2.5 py-1 font-mono text-xs font-medium text-heading" title="Version"><span class="mr-1 font-sans font-normal text-muted">Version</span>0.1.0</span>
                <button id="theme-toggle" type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-line bg-card text-muted transition hover:text-heading focus:outline-none focus-visible:ring-2 focus-visible:ring-accent" aria-label="Toggle color theme" title="Toggle color theme">
                    <svg class="h-4 w-4 dark-only" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                    <svg class="h-4 w-4 light-only" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:grid lg:grid-cols-[14rem_minmax(0,1fr)] lg:gap-10 lg:px-8">
        <nav id="toc" class="mb-6 lg:sticky lg:top-20 lg:mb-0 lg:max-h-[calc(100vh-6rem)] lg:self-start lg:overflow-y-auto" aria-label="Maps"></nav>
        <main id="content" class="min-w-0 space-y-8"></main>
    </div>
    <script>
        window.defs = {}
                window.defs["Auth_Configuration"] = {
  "title" : "Auth Configuration",
  "type" : "object",
  "properties" : {
    "oidc" : {
      "$ref" : "#/components/schemas/OpenID_Connect_Protocol"
    },
    "ldap" : {
      "$ref" : "#/components/schemas/Lightweight_Directory_Access_Protocol"
    }
  },
  "additionalProperties" : false,
  "description" : "Exactly one sub property is specified."
};
                window.defs["Credentials"] = {
  "title" : "Credentials",
  "type" : "object",
  "properties" : {
    "name" : {
      "title" : "Credential Name",
      "minLength" : 1,
      "type" : "string",
      "description" : "Credential name value.",
      "default" : ""
    },
    "cloud" : {
      "title" : "Cloud Credential",
      "minLength" : 1,
      "type" : "string",
      "description" : "Credential key value.",
      "default" : ""
    }
  },
  "additionalProperties" : false,
  "description" : "Required map.<br/><strong><em>Click on property to go to map definition.</em></strong>",
  "nullable" : true
};
                window.defs["dataValues"] = {
  "type" : "object",
  "properties" : {
    "username" : {
      "title" : "Username",
      "minLength" : 1,
      "type" : "string",
      "description" : "Required string value.",
      "default" : ""
    },
    "replicas" : {
      "title" : "Replica amount",
      "minimum" : 1,
      "type" : "integer",
      "description" : "Required integer value.",
      "default" : 0
    },
    "responseTypes" : {
      "title" : "Response Types",
      "minItems" : 1,
      "type" : "array",
      "description" : "Required string array.",
      "example" : [ "<strong>Content-Length</strong>" ],
      "items" : {
        "type" : "string",
        "default" : ""
      },
      "default" : [ ],
      "x-example-description" : "Example"
    },
    "credential" : {
      "$ref" : "#/components/schemas/Credentials"
    },
    "password" : {
      "title" : "Password",
      "maxLength" : 8,
      "minLength" : 8,
      "type" : "string",
      "description" : "Ensure exact string length.",
      "default" : ""
    },
    "port" : {
      "title" : "Port Number",
      "maximum" : 65535,
      "minimum" : 1,
      "type" : "integer",
      "description" : "Ensure a value between min and max.",
      "default" : 1024
    },
    "provider" : {
      "title" : "Cloud Provider",
      "type" : "string",
      "description" : "Enumeration of string values.",
      "enum" : [ "aws", "azure", "vsphere" ],
      "default" : ""
    },
    "config" : {
      "$ref" : "#/components/schemas/Auth_Configuration"
    },
    "selector" : {
      "title" : "LoadBalancer Selector",
      "type" : "string",
      "description" : "Conditional validations can be described manually.<br/><strong><span class=\"text-danger\">Required:</span></strong> when <strong>type</strong> equals <strong>LoadBalancer</strong>.",
      "default" : ""
    },
    "environment" : {
      "title" : "Environment Value",
      "description" : "Type is <strong>any</strong>, but we can use <strong>#@schema/examples</strong> to manually define values.",
      "nullable" : true,
      "example" : "[\"<strong>string</strong>\", \"<strong>integer</strong>\", \"<strong>boolean</strong>\"]",
      "default" : null,
      "x-example-description" : "Type"
    }
  },
  "additionalProperties" : false
};
                window.defs["Lightweight_Directory_Access_Protocol"] = {
  "title" : "Lightweight Directory Access Protocol",
  "type" : "object",
  "properties" : {
    "host" : {
      "title" : "Hostname",
      "type" : "string",
      "description" : "LDAP hostname.",
      "default" : ""
    }
  },
  "additionalProperties" : false,
  "description" : "<strong>NOTE:</strong> Only one of <strong>oidc</strong> or <strong>ldap</strong> can be specified at a time!",
  "nullable" : true
};
                window.defs["OpenID_Connect_Protocol"] = {
  "title" : "OpenID Connect Protocol",
  "type" : "object",
  "properties" : {
    "client_id" : {
      "title" : "Client ID",
      "type" : "string",
      "description" : "OIDC Client ID.",
      "default" : ""
    }
  },
  "additionalProperties" : false,
  "description" : "<strong>NOTE:</strong> Only one of <strong>oidc</strong> or <strong>ldap</strong> can be specified at a time!",
  "nullable" : true
};
    </script>
    <script src="bundle.js"></script>
</body>
</html>
